server {
    listen 80;

    # ---- PROXY API-ENDPOINTS TILL BACKEND ----
    # Proxar ALLA API-anrop som börjar på /images/list till FastAPI (backend)
    location ~ ^/images/list {
        proxy_pass http://aurora:32231;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lägg gärna till fler API-routes här vid behov, t.ex:
    location ~ ^/(api|magneto|solarwind|kp|hp30|skyfield|astro|weather|timelapse|synoptic) {
        proxy_pass http://aurora:32231;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /data/images/ {
        alias /app/data/images/;
        expires 15m;
        add_header Cache-Control "public, max-age=900, must-revalidate";
		add_header Vary Accept-Encoding;
		try_files $uri =404;
    }

    location /data/noaa_anim/ {
        alias /app/data/noaa_anim/;
		autoindex on;
        expires 15m;
        add_header Cache-Control "public, max-age=900, must-revalidate";
		add_header Vary Accept-Encoding;
		try_files $uri =404;
    }

    location /data/huxt/ {
        alias /app/data/huxt/;
        expires 15m;
        add_header Cache-Control "public, max-age=900, must-revalidate";
		add_header Vary Accept-Encoding;
		try_files $uri =404;
    }

    location /data/suvi-timelapse/ {
        alias /app/data/suvi-timelapse/;
        expires 30d;
        add_header Cache-Control "public";
		add_header Vary Accept-Encoding;
		try_files $uri =404;
    }

    location /data/icons/ {
        alias /app/data/icons/;
        expires 30d;
        add_header Cache-Control "public";
		add_header Vary Accept-Encoding;
		try_files $uri =404;
    }

    location /static/ {
        alias /app/static/;
        expires 2h;
        add_header Cache-Control "public";
		add_header Vary Accept-Encoding;
		try_files $uri =404;
    }

    location /data/moon/ {
         alias /app/data/moon/;
         expires 30d;
         add_header Cache-Control "public";
		 add_header Vary Accept-Encoding;
		 try_files $uri =404;
     }

    # ---- DEFAULT: PROXY ALLT ANNAT TILL BACKEND ----
    # Så API-endpoints och HTML-routes fungerar som vanligt
    location / {
        proxy_pass http://aurora:32231;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

		location ^~ /allsky-images/ {
				alias /allsky-images/;
				autoindex on;
				autoindex_exact_size off;
				autoindex_localtime on;

				add_header Cache-Control "public, max-age=300, must-revalidate";
				add_header Vary Accept-Encoding;

				try_files $uri $uri/ =404;
		}


}

gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/rss+xml
  application/atom+xml
  application/xhtml+xml
  application/font-woff2
  application/font-woff
  application/vnd.ms-fontobject
  application/x-font-ttf
  font/opentype
  image/svg+xml;
