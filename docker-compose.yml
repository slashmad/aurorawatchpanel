x-env-file: &env-file
  - .env

services:
  mariadb:
    container_name: aurora-watch-mariadb
    image: mariadb:11
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    restart: unless-stopped
    env_file: *env-file
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb_data:/var/lib/mysql

  aurora:
    container_name: aurora-watch-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    depends_on:
      - mariadb
    ports:
      - "32231:32231"
    volumes:
      - ./app:/app
      - ./app/data:/app/data
      - ${ALLSKY_IMAGES_PATH:-./app/data/allsky-images}:/allsky-images:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    container_name: aurora-nginx
    env_file: *env-file
    depends_on:
      - aurora
    ports:
      - "32230:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app:/app
      - ./app/data:/app/data
      - ./app/static:/app/static
      - ./app/data/icons:/app/data/icons
      - ./app/data/moon:/app/data/moon
      - ./app/data/images:/app/data/images
      - ./app/data/noaa_anim:/app/data/noaa_anim
      - ./app/data/suvi-timelapse:/app/data/suvi-timelapse
      - ${ALLSKY_IMAGES_PATH:-./app/data/allsky-images}:/allsky-images:ro

  fetch_solarwind:
    container_name: aurora-watch-solarwind
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_solarwind.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  fetch_magnetometer:
    container_name: aurora-watch-fetch-irf
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_magnetometer.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  #fetch_magnetometer_uit:
  #  container_name: aurora-watch-fetch-uit
  #  image: aurora-watch-nextgen:latest
  #  command: python fetch_magnetometer_uit.py
  #  working_dir: /app
  #  depends_on:
  #    - mariadb
  #  volumes:
  #    - ./app:/app
  #  restart: unless-stopped

  fetch_magnetometer_fmi:
    container_name: aurora-watch-fetch-fmi
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_magnetometer_fmi.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  fetch_magnetometer_global:
    container_name: aurora-watch-fetch-global
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_magnetometer_global.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  hp30_fetch:
    container_name: aurora-watch-fetch-hp30
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python hp30_fetch.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  fetch_kpindex:
    container_name: aurora-watch-fetch-kpindex
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_kpindex.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  fetch_images:
    container_name: aurora-watch-fetch-sdo
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    volumes:
      - ./app/data/images:/app/data/images
      - ./app:/app
    environment:
      - SDO_FETCH_WORKERS=8
      - LYCKEBOCAM_ENABLE=0
    command: python fetch_images.py
    working_dir: /app
    depends_on:
      - mariadb
    restart: unless-stopped

  fetch_images_lyckebo:
    container_name: aurora-watch-fetch-lyckebo
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    working_dir: /app
    command: ["python3", "fetch_images_lyckebo.py"]
    environment:
      - IMAGE_ROOT=/app/data/images
      - LYCKEBO_DIRLIST_URL=https://lyckebosommargard.se/wp-content/uploads/Webcam/
      - LYCKEBO_POLL_SECONDS=60
      - LYCKEBO_STARTUP_SYNC=1
      - LYCKEBO_STARTUP_MAX=0
      - LYCKEBO_INCREMENTAL_MAX=30
      - LYCKEBO_HTTP_RETRIES=4
    volumes:
      - ./app/data/images:/app/data/images
      - ./app:/app
    restart: unless-stopped

  fetch_ovation_aurora:
    container_name: aurora-watch-fetch-ovation
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_ovation_aurora.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  render_aurora_oval:
    container_name: aurora-watch-render-ovation
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python render_aurora_oval.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  fetch_solaractivity:
    container_name: aurora-watch-fetch-solaractivity
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_solaractivity.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app:/app
    restart: unless-stopped

  fetch_enlil:
    container_name: aurora-watch-fetch-enlil
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_enlil_fits.py
    working_dir: /app
    depends_on:
      - mariadb
    volumes:
      - ./app/data:/app/data
      - ./app:/app
    restart: unless-stopped

  fetch_huxt:
    container_name: aurora-watch-fetch-huxt
    image: aurora-watch-nextgen:latest
    env_file: *env-file
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8
    command: python fetch_huxt_forecast.py
    working_dir: /app
    volumes:
      - ./app:/app
    restart: unless-stopped

volumes:
  mariadb_data:
