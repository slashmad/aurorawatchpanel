[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_images_list.py", "test_main_database_endpoints.py", "test_fetch_solarwind.py", "test_skyfield_astro.py", "test_magnetometer_sql.py", "test_fetch_magnetometer.py"]
asyncio_mode = "strict"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7"]

[tool.mypy]
python_version = "3.11"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
